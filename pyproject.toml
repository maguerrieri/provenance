[project]
name = "provenance"
version = "0.1.0"
description = "Voter guide research pipeline: cited-claim verification + local review app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
provenance = "provenance.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "isort>=5.13"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
