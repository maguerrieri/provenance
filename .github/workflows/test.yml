name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Node 24 actions: hosted runners dropped Node 20 on 2026-09-16. setup-uv's Node 24
      # releases have no moving major tag, so it is pinned to one.
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      # The suite is offline by design — every fetch is stubbed — so CI needs no network
      # access and can't go flaky on a source site being slow or blocking runners.
      - run: uv run pytest -q
