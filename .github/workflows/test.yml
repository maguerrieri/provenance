name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      # The suite is offline by design — every fetch is stubbed — so CI needs no network
      # access and can't go flaky on a source site being slow or blocking runners.
      - run: uv run pytest -q
